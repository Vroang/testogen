# Проверка сборки без публикации: юнит-тесты, lint и release-сборка. Если ключ подписи доступен
# (пуш в этот репозиторий), release подписывается им и сверяется сертификат с v49 — так заранее видно,
# что обновление встанет поверх. Ничего не выкладывает и тегов не создаёт; релиз для мамы — только
# release.yml по тегу v<versionCode>.
name: Check build

on:
  push:
    branches: [ rewrite ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Та же версия JDK, что в release.yml: если здесь собирается, соберётся и релиз
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # У PR из чужих копий секретов нет — тогда release собирается неподписанным
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore; fi

      - name: Unit tests, lint, release build
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Signing certificate matches v49
        if: hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        run: bash tools/check_cert.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
