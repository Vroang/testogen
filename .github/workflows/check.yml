# Проверка сборки без публикации: юнит-тесты, lint и release-сборка (неподписанная, ключи не нужны).
# Ничего не выкладывает и тегов не создаёт; релиз для мамы — только release.yml по тегу v<versionCode>.
name: Check build

on:
  push:
    branches: [ rewrite ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Та же версия JDK, что в release.yml: если здесь собирается, соберётся и релиз
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests, lint, release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
