name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Подпись должна совпадать со старыми версиями, иначе у мамы обновление не встанет — релиз не создаётся
      - name: Signing certificate matches v49
        run: bash tools/check_cert.sh app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          mkdir -p output
          # Без ключей Gradle собирает app-release-unsigned.apk — такой выкладывать нельзя.
          # Явный путь к подписанному файлу: если его нет, шаг упадёт и релиз не создастся.
          # GitHub вырезает кириллицу из имён файлов релиза, поэтому латиницей
          cp app/build/outputs/apk/release/app-release.apk "output/Testogen-${{ github.ref_name }}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
